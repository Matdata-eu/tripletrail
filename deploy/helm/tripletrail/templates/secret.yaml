{{- if include "tripletrail.makesSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tripletrail.secretName" . }}
  labels:
    {{- include "tripletrail.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.adminToken.value (not .Values.adminToken.existingSecret) }}
  {{ .Values.adminToken.key }}: {{ .Values.adminToken.value | b64enc | quote }}
  {{- end }}
  {{- if and .Values.updateToken.value (not .Values.updateToken.existingSecret) }}
  {{ .Values.updateToken.key }}: {{ .Values.updateToken.value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.authConfig.enabled (not .Values.authConfig.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tripletrail.fullname" . }}-auth
  labels:
    {{- include "tripletrail.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.authConfig.key }}: {{ .Values.authConfig.config | toPrettyJson | b64enc | quote }}
{{- end }}
