[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tripletrail"
description = "TripleTrail in Python: a knowledge graph store with GeoSPARQL, PostGIS-style ST_* functions and pgRouting-style routing, built on Oxigraph"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
rdflib = ["rdflib>=7"]

[project.entry-points."rdf.plugins.store"]
TripleTrail = "tripletrail.rdflib:TripleTrailStore"

[tool.maturin]
module-name = "tripletrail._tripletrail"
