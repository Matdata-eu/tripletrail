[workspace]
resolver = "2"
exclude = ["python", "vendor"]
members = ["crates/tripletrail-routing", "crates/tripletrail-geo", "crates/tripletrail-pgr", "crates/tripletrail-shacl", "crates/tripletrail-spatial", "crates/tripletrail-store", "crates/tripletrail-fx", "crates/tripletrail-rml", "crates/tripletrail", "crates/tripletrail-server", "crates/tripletrail-testsuite", "crates/tripletrail-testdir"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Matdata-eu/tripletrail"
license = "Apache-2.0"

[workspace.dependencies]
oxigraph = { version = "0.5.13", default-features = false, features = ["rdf-12"] }
spareval = { version = "0.2.9", features = ["sparql-12"] }
spargebra = { version = "0.4.8", features = ["sparql-12"] }
oxiri = "0.2"
geo = "0.33.1"
wkt = "0.14.0"
serde_json = "1"
yaml-rust2 = { version = "0.10", default-features = false }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
csv = "1"
calamine = { version = "0.38", default-features = false }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"
regex = "1"
shapefile = { version = "0.9", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
geo-traits = "0.3.0"
quick-xml = "0.41"
# HTML for Facade-X (MIT OR Apache-2.0).
html5ever = "0.40"
markup5ever_rcdom = "0.40"
thiserror = "2"
# GraphQL (#144): parsing, validation, introspection and a dynamic schema (MIT OR Apache-2.0).
async-graphql = { version = "7.2", default-features = false, features = ["dynamic-schema"] }
pollster = "1"
tripletrail-geo = { path = "crates/tripletrail-geo", version = "0.1.0-rc.2" }
tripletrail-routing = { path = "crates/tripletrail-routing", version = "0.1.0-rc.2" }
tripletrail-pgr = { path = "crates/tripletrail-pgr", version = "0.1.0-rc.2" }
tripletrail-shacl = { path = "crates/tripletrail-shacl", version = "0.1.0-rc.2" }
tripletrail-spatial = { path = "crates/tripletrail-spatial", version = "0.1.0-rc.2" }
tripletrail-store = { path = "crates/tripletrail-store", version = "0.1.0-rc.2" }
tripletrail-fx = { path = "crates/tripletrail-fx", version = "0.1.0-rc.2" }
tripletrail-rml = { path = "crates/tripletrail-rml", version = "0.1.0-rc.2" }
tripletrail = { path = "crates/tripletrail", version = "0.1.0-rc.2" }
tripletrail-testdir = { path = "crates/tripletrail-testdir" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Oxigraph's SPARQL optimizer, with a fix to how it plans the right side of LATERAL joins
# (see vendor/sparopt/TRIPLETRAIL.md).
[patch.crates-io]
spargebra = { path = "vendor/spargebra" }
sparopt = { path = "vendor/sparopt" }
spareval = { path = "vendor/spareval" }
oxrdfxml = { path = "vendor/oxrdfxml" }
sparesults = { path = "vendor/sparesults" }
# tiny_http 0.12, closing the connection after a body that failed half way (#549, see
# vendor/tiny_http/TRIPLETRAIL.md).
tiny_http = { path = "vendor/tiny_http" }
