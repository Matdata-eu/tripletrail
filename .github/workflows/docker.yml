name: Docker image

# Builds the server image for linux/amd64 and linux/arm64, smoke-tests the amd64 one, and
# publishes both to ghcr.io/matdata-eu/tripletrail with an SBOM and a provenance attestation.
# With the repository variable COSIGN_SIGN set to `true`, it also signs them with cosign
# (keyless, by this workflow's GitHub identity). The Dockerfile
# cross-compiles, so the arm64 image takes no emulation.
# A version tag (`v*`) publishes `1.2.3`, `1.2` and `latest` by itself, so each release has an
# image other images can copy the command from (#93). Otherwise manual, to save runner time:
# start it from the Actions tab; run on main it publishes tag `main`. A short-sha tag either way.
# A pre-release tag (`v0.1.0-rc.3`) publishes only `0.1.0-rc.3`: `1.2` and `latest` move on releases.
# Untick "publish" to only build and smoke-test (e.g. to try an image change on a branch).
#
# Signing is off until the repository is public (#150): keyless signing writes the
# repository name, workflow, ref and commit SHA to Sigstore's public transparency log, for
# good. Set COSIGN_SIGN=true then. Verify a signed image:
#   cosign verify ghcr.io/matdata-eu/tripletrail:<tag> \
#     --certificate-identity-regexp '^https://github.com/Matdata-eu/tripletrail/.github/workflows/docker.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io after the smoke test
        type: boolean
        default: true

# A newer run on the same branch replaces one still running; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write
  # For cosign's keyless signing (only with COSIGN_SIGN): a short-lived certificate for this
  # workflow's identity.
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The image carries the third-party license list in /usr/share/doc/tripletrail.
      - name: Third-party licenses
        run: |
          cargo fetch --locked
          python3 .github/scripts/third-party-licenses.py -o THIRD_PARTY_LICENSES.md
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: (inputs.publish || github.event_name == 'push')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/matdata-eu/tripletrail
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      # Build into the local image store first, so the smoke test runs before anything is
      # published; the push step below reuses the same layers from the cache.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tripletrail:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A free host port, so the smoke test never clashes with a server already on 7878.
      - name: Smoke test
        run: |
          docker rm -f tripletrail-smoke 2>/dev/null || true
          docker run -d --name tripletrail-smoke -p 127.0.0.1::7878 tripletrail:test
          trap 'docker logs tripletrail-smoke; docker rm -f tripletrail-smoke' EXIT
          base="http://$(docker port tripletrail-smoke 7878/tcp | head -n1)"
          for i in $(seq 1 30); do
            if curl -sf "$base/\$/ready"; then break; fi
            sleep 1
          done
          curl -sf "$base/\$/ready"
          curl -sf "$base/ds/query" --data-urlencode 'query=ASK {}' | grep -q true
          curl -sf "$base/\$/ui/" | grep -q yasgui
      - name: Push
        id: push
        if: (inputs.publish || github.event_name == 'push')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Off until the repository is public: see the top of this file.
      - uses: sigstore/cosign-installer@v3
        if: (inputs.publish || github.event_name == 'push') && vars.COSIGN_SIGN == 'true'
      # Signs the multi-platform index by digest, which covers both images; then checks the
      # signature the way a user would.
      - name: Sign
        if: (inputs.publish || github.event_name == 'push') && vars.COSIGN_SIGN == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=ghcr.io/matdata-eu/tripletrail
          cosign sign --yes "$image@$DIGEST"
          cosign verify "$image@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signed $image@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      # A self-hosted runner keeps its Docker images: the smoke-test container and the image
      # loaded for it go with the job, also when a step failed, instead of piling up a stale
      # image per run.
      - name: Remove the smoke-test container and image
        if: always() && runner.environment != 'github-hosted'
        run: |
          docker rm -f tripletrail-smoke 2>/dev/null || true
          docker image rm -f tripletrail:test 2>/dev/null || true
