name: Release

# Release binaries of `tripletrail` (the server and the CLI are one binary) for Linux (x86_64,
# aarch64), macOS (x86_64, arm64) and Windows (x86_64), with SHA256SUMS, published as a GitHub
# release with notes from CHANGELOG.md and the Conventional Commits since the last tag.
#
# Pushing a tag `v1.2.3` runs all of it and creates the release; a release made on GitHub's
# Releases page with a new tag pushes that tag too, and gets the files and notes. Before tagging: set the
# workspace version in Cargo.toml, rename "## [Unreleased]" in CHANGELOG.md to "## 1.2.3" and
# add the release's entry at the top of crates/tripletrail-server/ui/whats-new.json; the check
# job refuses the release otherwise (.github/scripts/release-notes.sh --check).
#
# Started by hand it is a dry run: it builds and packages everything and keeps the result as
# a workflow artifact, without a release. macOS and Windows run on GitHub's runners, which
# count 10x and 2x against the private repository's minutes; untick them to save those.
#
# The binaries are not signed yet: cosign keyless signing would write the repository's name
# and commits to Sigstore's public log, so it waits until the repository is public (#150).
#
# The same run builds the Python package (wheels for Linux, macOS and Windows; no source
# package, as it would need the workspace and vendor/ around python/)
# and packs the JavaScript client. After the GitHub release, a tag publishes them to PyPI
# (`tripletrail`) and npm (`@matdata/tripletrail-client`), each only while its repository variable is
# `true`: PUBLISH_PYPI, PUBLISH_NPM. Both log in with trusted publishing (OIDC, no token).
# npm can only give an existing package a trusted publisher, so its first version is
# published once by hand (CONTRIBUTING.md, "Releasing"). A pre-release (`v1.2.3-rc.1`) goes to
# npm under the `next` tag, so `latest` stays on the last release. The Rust crates are not
# published: they need the patched Oxigraph crates in vendor/, which crates.io cannot use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: Build for macOS (GitHub runner, 10x minutes)
        type: boolean
        default: true
      windows:
        description: Build for Windows (GitHub runner, 2x minutes)
        type: boolean
        default: true
      python:
        description: Build the Python wheels
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The third-party list runs `cargo fetch`; the light runner has no Rust of its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Version, CHANGELOG and whats-new.json agree
        run: .github/scripts/release-notes.sh --check "${{ steps.version.outputs.version }}"
      - name: Release notes
        run: .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
      # One list for every platform, packaged with each binary and published with the release.
      - name: Third-party licenses
        run: |
          cargo fetch --locked
          python3 .github/scripts/third-party-licenses.py -o THIRD_PARTY_LICENSES.md
      # The Python package links its own set (python/Cargo.lock), shipped in each wheel.
      - name: Third-party licenses of the Python package
        run: |
          cargo fetch --locked --manifest-path python/Cargo.toml
          mkdir -p python-third-party
          python3 .github/scripts/third-party-licenses.py --package tripletrail-python \
            --manifest-path python/Cargo.toml --product '`tripletrail` Python package' \
            -o python-third-party/THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v7
        with:
          name: third-party
          path: THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-python
          path: python-third-party/THIRD_PARTY_LICENSES.md

  # Both Linux binaries from the Dockerfile's build stage, cross-compiled on one machine and
  # linked against Debian 12's glibc (2.36), so they run on most current distributions.
  linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        # No build record artifact (`*.dockerbuild`): the release job downloads every
        # artifact of the run, and actions/download-artifact fails on that one.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: binary
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out
          cache-from: type=gha
      - uses: actions/download-artifact@v8
        with:
          name: third-party
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          for p in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            name="tripletrail-$VERSION-${p#*:}"
            mkdir -p "pkg/$name"
            cp "out/linux_${p%%:*}/tripletrail" LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md CHANGELOG.md "pkg/$name/"
            chmod +x "pkg/$name/tripletrail"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  macos:
    needs: check
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            CARGO_PROFILE_RELEASE_DEBUG=false CARGO_PROFILE_RELEASE_STRIP=symbols \
              cargo build --release --locked -p tripletrail-server --target "$target"
          done
      - uses: actions/download-artifact@v8
        with:
          name: third-party
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            name="tripletrail-$VERSION-$target"
            mkdir -p "pkg/$name"
            cp "target/$target/release/tripletrail" LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md CHANGELOG.md "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          ./target/aarch64-apple-darwin/release/tripletrail --help > /dev/null
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    needs: check
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: cargo build --release --locked -p tripletrail-server --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v8
        with:
          name: third-party
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $name = "tripletrail-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "pkg/$name", dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tripletrail.exe, LICENSE, NOTICE, THIRD_PARTY_LICENSES.md, README.md, CHANGELOG.md "pkg/$name/"
          & "pkg/$name/tripletrail.exe" --help | Out-Null
          Compress-Archive -Path "pkg/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  # Python wheels: one per platform (abi3, so every Python from 3.9), with on-disk stores
  # (RocksDB) and GeoParquet, as `pip install ./python` builds them. Linux wheels are built in
  # manylinux_2_28 containers (glibc 2.28), aarch64 natively on GitHub's Arm runner.
  python-wheels:
    needs: check
    if: github.event_name == 'push' || inputs.python
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: "" }
          - { os: windows-latest, target: x64, manylinux: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # RocksDB needs C++17 aligned allocation, which macOS has from 10.14 (maturin's default
      # target is 10.12). Only read on macOS.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: third-party-python
          path: python-third-party
      # LICENSE and NOTICE go into the wheel's metadata (maturin picks up LICENSE* and
      # NOTICE*); all three, with the third-party list, into the package folder too.
      - name: License files
        shell: bash
        run: |
          cp LICENSE NOTICE python/
          cp LICENSE NOTICE python-third-party/THIRD_PARTY_LICENSES.md python/tripletrail/
      # Pinned by commit: it runs in the release workflow. v1.51.0.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
          # RocksDB's bindings are generated with bindgen, which needs libclang.
          before-script-linux: dnf install -y clang-devel
      - name: The wheel imports
        shell: bash
        run: |
          python -m pip install --no-index --find-links python/dist tripletrail
          python -c "import tripletrail; e = tripletrail.Engine(); print(e.query('ASK {}'))"
          python - python/dist/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for f in ("LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"):
              assert f"tripletrail/{f}" in names, f"{f} is not in the wheel"
          print("license files in the wheel")
          EOF
          ls -l python/dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl

  # The JavaScript client as npm would publish it, kept as `matdata-tripletrail-client-<version>.tgz`.
  npm-pack:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pack
        working-directory: clients/js
        run: |
          cp ../../LICENSE ../../NOTICE .
          npm pack --json | tee pack.json
          ls -l ./*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: clients/js/*.tgz

  release:
    needs: [check, linux, macos, windows]
    # macOS and Windows may be skipped on a dry run; a tag needs them all.
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.linux.result == 'success'
      && (github.event_name != 'push' || (needs.macos.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the release's own artifacts, by name.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux,macos,windows,notes,third-party}"
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          mv artifacts/notes/notes.md .
          mv artifacts/third-party/THIRD_PARTY_LICENSES.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        # A release made on GitHub's Releases page (which also pushes the tag) is filled in:
        # the files are added, and the notes are set unless it already has some.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "$(printf %s "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "TripleTrail $VERSION" --notes-file notes.md --verify-tag
          fi
      - name: Keep the dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/*
            notes.md

  # PyPI with trusted publishing: the project's publisher on pypi.org names this repository,
  # this workflow (release.yml) and the environment `pypi`. Only after the GitHub release.
  publish-pypi:
    needs: [release, python-wheels]
    if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/tripletrail/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # Pinned by commit: it runs with id-token: write. v1.14.3.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist

  # npm with trusted publishing (npm 11.5 or later; the package's publisher on npmjs.com names
  # this repository, release.yml and the environment `npm`). The provenance statement links
  # the package to this run.
  publish-npm:
    needs: [check, release, npm-pack]
    if: github.event_name == 'push' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@matdata/tripletrail-client
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm
      - name: Publish
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          npm install -g npm@11
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish ./matdata-tripletrail-client-*.tgz --access public --provenance --tag "$tag"
