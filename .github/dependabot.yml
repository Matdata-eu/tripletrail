# .github/dependabot.yml for tripletrail. Weekly and grouped, so that dependency updates
# arrive as a few reviewable PRs instead of a stream. The reviewers merge them like any
# other PR (they pass "PR links an issue" without an issue).
#
# The patched Oxigraph crates in vendor/ are excluded: they're upgraded by hand.
# Copy and trim for the other repos (bench: cargo + actions; website: npm only if it gets
# dependencies; demo and enterprise: cargo + actions + docker).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Brussels }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "oxigraph*"
      - dependency-name: "oxrdfxml"
      - dependency-name: "sparesults"
      - dependency-name: "spareval"
      - dependency-name: "spargebra"
      - dependency-name: "sparopt"
      - dependency-name: "tiny_http"
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/clients/js, /crates/tripletrail-server/ui-tests]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Brussels }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
