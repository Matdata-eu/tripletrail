[package]
name = "tripletrail-server"
description = "SPARQL 1.1 Protocol and Graph Store Protocol server for tripletrail (`tripletrail serve`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "tripletrail"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1.43", default-features = false, optional = true }
tripletrail.workspace = true
tripletrail-rml.workspace = true
oxigraph.workspace = true
geo.workspace = true
tiny_http = "0.12"
serde_json.workspace = true
quick-xml.workspace = true
flate2 = "1"
yaml-rust2.workspace = true
async-graphql.workspace = true
pollster.workspace = true
ctrlc = { version = "3", features = ["termination"] }
form_urlencoded = "1"
oxsdatatypes = "0.2.4"
sha2 = "0.11.1"
getrandom = "0.4"
# The Import page turns a CONSTRUCT into an INSERT (#20); already in the engine.
spargebra.workspace = true
# tts:labelStrip patterns (#260); already in the engine.
regex.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rustls = { workspace = true, optional = true }
gix = { version = "0.90", default-features = false, features = ["sha1", "blocking-network-client"], optional = true }
# Only to turn on gix's HTTP transport, which `shapes_git` drives with ureq.
gix-transport = { version = "0.62", features = ["http-client"], optional = true }
# ureq 3 under another name, so that the tests keep their ureq 2 client (dev-dependencies).
ureq3 = { package = "ureq", version = "3", optional = true }
tar = { version = "0.4.46", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tripletrail-testdir.workspace = true
serde_json.workspace = true
ureq = "2"
rustls.workspace = true
postgres.workspace = true
# Signing test tokens for single sign-on (#198); already in the tree through rustls.
ring = "0.17"

[features]
default = ["geoparquet", "git", "mimalloc", "otel", "postgres", "remote-service", "replication", "tls"]
# mimalloc as the allocator of the `tripletrail` binary (#934): glibc's malloc contends when one
# thread frees what another allocated, as an INSERT … WHERE does with its rows.
mimalloc = ["dep:mimalloc"]
# Native TLS (`--tls-cert`, `--tls-key`), with rustls.
tls = ["dep:rustls"]
# GeoParquet: `load` of .parquet files, `export`, and SELECT results as GeoParquet.
geoparquet = ["tripletrail/geoparquet"]
# `lift` of R2RML/RML/YARRRML mappings on PostgreSQL tables.
postgres = ["tripletrail-rml/postgres"]
# SERVICE to remote SPARQL endpoints (`--service-allow`).
remote-service = ["tripletrail/remote-service"]
# Shapes pulled from a git repository (`…/shapes/git`), with gix.
git = ["dep:gix", "dep:gix-transport", "dep:ureq3"]
# OpenTelemetry traces sent to an OTLP collector (`--otlp-endpoint`, #220).
otel = ["dep:ureq3"]
# Read replicas (`--follow`) and the leader's `/$/replication/` endpoints (#217).
replication = ["dep:ureq3", "dep:tar"]
# On-disk datasets (`--location`).
rocksdb = ["oxigraph/rocksdb"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("enterprise"))'] }
